name: Validate Tutorial Hub

on:
  pull_request:
    branches: [main, enhancement/dsa-stage-learning-content, feature/intelligent-content-studio]
  push:
    branches: [main, fix/api-integration, enhancement/dsa-stage-learning-content, feature/intelligent-content-studio, 'feat/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Verify handwritten DSA notes curriculum coverage
        run: npm run test:dsa:handwritten
      - name: Verify DSA topic completeness pilot
        run: npm run test:dsa:completeness-pilot
      - name: Verify source-authored DSA solutions (Java, JavaScript, Python)
        run: npm run test:dsa:arrays:01
      - name: Test Content Studio ingestion and classification
        run: npm run test:content-authoring
      - name: Test canonical content publishing authorization
        run: npm run test:content-bootstrap-security
      - name: Test System Design AI security policy
        run: npm run test:system-design-ai-security
      - name: Test solver endpoint security policy
        run: npm run test:solver-endpoint-security
      - name: Verify the canonical 293-question DSA inventory and blueprint boundaries
        run: npm run test:dsa:inventory
      - name: Verify Pattern Forge five-stage learning engine
        run: npm run test:learning-engine
      - name: Verify Pattern Forge topic selection does not trigger redundant state updates
        run: npm run test:pattern-forge:state
      - name: Validate canonical learning surface inventory
        run: npm run audit:learning-surfaces
      - name: Validate application-wide content quality audit ledger
        run: npm run audit:learning-content
      - name: Scan registered learner-facing content for wording review targets (advisory)
        run: npm run audit:application-content
      - name: Inventory canonical topic and lesson candidates
        run: node --test tests/content-authoring/topic-content-inventory.test.mjs
      - name: Build frontend
        run: npm run build
