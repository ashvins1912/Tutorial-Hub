name: Validate Tutorial Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/api-integration]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Verify source-authored DSA solutions (Java, JavaScript, Python)
        run: npm run test:dsa:arrays:01
      - name: Build frontend
        run: npm run build
